name: Build BIMBaoGui GHA

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - ".gitattributes"
      - "Directory.Build.*"
      - "**/*.props"
      - "**/*.targets"
      - "**/.editorconfig"
      - "**/*.globalconfig"
      - "**/*.ruleset"
      - "src/**"
      - "specs/hifc-mapping/**"
      - "specs/hbr-rules/**"
      - "tools/build_hbr_rulepack.py"
      - "tests/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-stage01-gha.yml"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - ".gitattributes"
      - "Directory.Build.*"
      - "**/*.props"
      - "**/*.targets"
      - "**/.editorconfig"
      - "**/*.globalconfig"
      - "**/*.ruleset"
      - "src/**"
      - "specs/hifc-mapping/**"
      - "specs/hbr-rules/**"
      - "tools/build_hbr_rulepack.py"
      - "tests/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-stage01-gha.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check committed diff whitespace
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
            if ([string]::IsNullOrWhiteSpace($env:PR_BASE_SHA)) {
              throw "Pull request base SHA is unavailable."
            }
            $range = "$env:PR_BASE_SHA...$env:HEAD_SHA"
          } elseif ($env:EVENT_NAME -eq "push") {
            if (-not [string]::IsNullOrWhiteSpace($env:BEFORE_SHA) -and
              $env:BEFORE_SHA -notmatch '^0+$') {
              $range = "$env:BEFORE_SHA..$env:HEAD_SHA"
            } else {
              if ([string]::IsNullOrWhiteSpace($env:DEFAULT_BRANCH)) {
                throw "Repository default branch is unavailable."
              }
              $defaultRef = "refs/remotes/origin/$env:DEFAULT_BRANCH"
              git rev-parse --verify $defaultRef
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to resolve default branch ref: $defaultRef"
              }
              $mergeBase = git merge-base $defaultRef $env:HEAD_SHA
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mergeBase)) {
                throw "Unable to resolve merge base for new branch push."
              }
              $range = "$mergeBase..$env:HEAD_SHA"
            }
          } elseif ($env:EVENT_NAME -eq "workflow_dispatch") {
            if ([string]::IsNullOrWhiteSpace($env:DEFAULT_BRANCH)) {
              throw "Repository default branch is unavailable."
            }
            $defaultRef = "refs/remotes/origin/$env:DEFAULT_BRANCH"
            git rev-parse --verify $defaultRef
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to resolve default branch ref: $defaultRef"
            }
            $mergeBase = git merge-base $defaultRef $env:HEAD_SHA
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mergeBase)) {
              throw "Unable to resolve merge base for workflow dispatch."
            }
            $range = "$mergeBase..$env:HEAD_SHA"
          } else {
            throw "Unsupported GitHub event: $env:EVENT_NAME"
          }
          git diff --check $range
          if ($LASTEXITCODE -ne 0) {
            throw "Committed diff whitespace check failed for $range."
          }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET projects
        shell: pwsh
        run: |
          dotnet restore tests/BIMBaoGui.Stage01.Core.Tests/BIMBaoGui.Stage01.Core.Tests.csproj
          dotnet restore src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5 jsonschema==4.23.0

      - name: Run rule pack compiler and packaging contracts
        shell: pwsh
        run: python -m pytest tests/test_hbr_rulepack_compiler.py tests/test_hbr_runtime_packaging_contract.py -q

      - name: Run repository contract tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Fail on vulnerable NuGet packages
        shell: pwsh
        run: |
          $expectedProjectPath = [IO.Path]::GetFullPath("src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj")
          $inventoryJson = dotnet list src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj package --include-transitive --format json
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet package inventory command failed."
          }
          try {
            $inventory = ($inventoryJson -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "NuGet package inventory returned invalid JSON: $($_.Exception.Message)"
          }
          if ($inventory.version -ne 1) {
            throw "NuGet package inventory returned an unsupported schema version."
          }
          $inventoryProjects = @($inventory.projects | Where-Object { $null -ne $_ })
          if ($inventoryProjects.Count -ne 1) {
            throw "NuGet package inventory must contain exactly one project."
          }
          foreach ($project in $inventoryProjects) {
            if ([string]::IsNullOrWhiteSpace($project.path)) {
              throw "NuGet package inventory project path is missing."
            }
            $projectPath = [IO.Path]::GetFullPath($project.path)
            if (-not [string]::Equals($projectPath, $expectedProjectPath, [StringComparison]::OrdinalIgnoreCase)) {
              throw "NuGet package inventory returned an unexpected project: $projectPath"
            }
            $frameworks = @($project.frameworks | Where-Object { $null -ne $_ })
            if ($frameworks.Count -eq 0) {
              throw "NuGet package inventory project does not contain a framework: $projectPath"
            }
            foreach ($framework in $frameworks) {
              if ([string]::IsNullOrWhiteSpace($framework.framework)) {
                throw "NuGet package inventory contains a framework without an identity."
              }
            }
          }

          $reportJson = dotnet list src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability scan command failed."
          }
          try {
            $report = ($reportJson -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "NuGet vulnerability scan returned invalid JSON: $($_.Exception.Message)"
          }
          if ($report.version -ne 1) {
            throw "NuGet vulnerability scan returned an unsupported schema version."
          }
          $projects = @($report.projects | Where-Object { $null -ne $_ })
          if ($projects.Count -eq 0) {
            throw "NuGet vulnerability scan JSON does not contain a project."
          }
          if ($projects.Count -ne 1) {
            throw "NuGet vulnerability scan must contain exactly one project."
          }
          $vulnerablePackages = @()
          foreach ($project in $projects) {
            if ([string]::IsNullOrWhiteSpace($project.path)) {
              throw "NuGet vulnerability scan project path is missing."
            }
            $projectPath = [IO.Path]::GetFullPath($project.path)
            if (-not [string]::Equals($projectPath, $expectedProjectPath, [StringComparison]::OrdinalIgnoreCase)) {
              throw "NuGet vulnerability scan returned an unexpected project: $projectPath"
            }
            foreach ($framework in @($project.frameworks | Where-Object { $null -ne $_ })) {
              if ([string]::IsNullOrWhiteSpace($framework.framework)) {
                throw "NuGet vulnerability scan contains a framework without an identity."
              }
              $packages = @($framework.topLevelPackages) + @($framework.transitivePackages)
              $packages = @($packages | Where-Object { $null -ne $_ })
              foreach ($package in $packages) {
                if (@($package.vulnerabilities).Count -gt 0) {
                  $vulnerablePackages += [PSCustomObject]@{
                    Project = $project.path
                    Framework = $framework.framework
                    Package = $package.id
                    Version = $package.resolvedVersion
                    Vulnerabilities = (@($package.vulnerabilities) | ConvertTo-Json -Compress)
                  }
                }
              }
            }
          }
          if ($vulnerablePackages.Count -gt 0) {
            $vulnerablePackages | Format-Table -AutoSize | Out-String | Write-Error
            throw "Known vulnerable NuGet packages were found."
          }

      - name: Run core unit tests
        shell: pwsh
        run: dotnet test tests/BIMBaoGui.Stage01.Core.Tests/BIMBaoGui.Stage01.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Build Grasshopper plugin
        shell: pwsh
        run: dotnet build src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:TreatWarningsAsErrors=true

      - name: Verify compiled GHA
        id: verify
        shell: pwsh
        run: |
          $gha = Resolve-Path "src/BIMBaoGui.Stage01/bin/Release/net48/BIMBaoGui.Stage01.gha"
          $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($gha)
          if ($assembly.Name -ne "BIMBaoGui.Stage01") { throw "Unexpected assembly name: $($assembly.Name)" }
          if ($assembly.Version -ne "0.9.0.0") { throw "Unexpected assembly version: $($assembly.Version)" }
          $hash = (Get-FileHash $gha -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $gha).Length
          if ($size -lt 50000) { throw "GHA is unexpectedly small: $size bytes" }
          "gha_path=$gha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Assembly: $($assembly.FullName)"
          Write-Host "SHA256: $hash"
          Write-Host "Size: $size bytes"

      - name: Prepare validation artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src/BIMBaoGui.Stage01/bin/Release/net48/BIMBaoGui.Stage01.gha" "artifacts/BIMBaoGui.Stage01.gha"
          $manifest = [ordered]@{
            artifactName = "BIMBaoGui.Stage01.gha"
            assemblyVersion = "0.9.0.0"
            sha256 = "${{ steps.verify.outputs.sha256 }}"
            sizeBytes = [int64]"${{ steps.verify.outputs.size }}"
            commitSha = "${{ github.sha }}"
          }
          $manifest | ConvertTo-Json | Set-Content "artifacts/artifact-manifest.json" -Encoding utf8

      - name: Upload GHA and manifest
        uses: actions/upload-artifact@v4
        with:
          name: BIMBaoGui-Revit2020-Rhino8-v0.9.0-validation
          path: |
            artifacts/BIMBaoGui.Stage01.gha
            artifacts/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
