name: Build BIMBaoGui GHA

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - ".gitattributes"
      - "Directory.Build.*"
      - "**/*.props"
      - "**/*.targets"
      - "**/.editorconfig"
      - "**/*.globalconfig"
      - "**/*.ruleset"
      - "src/**"
      - "specs/hifc-mapping/**"
      - "specs/hbr-rules/**"
      - "tools/build_hbr_rulepack.py"
      - "tools/build_hbr_rules_manifest.py"
      - "tools/hifc/**"
      - "tests/**"
      - "tests/fixtures/hifc/**"
      - "README.md"
      - "docs/**"
      - "docs/hifc/acceptance/**"
      - ".github/workflows/build-stage01-gha.yml"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - ".gitattributes"
      - "Directory.Build.*"
      - "**/*.props"
      - "**/*.targets"
      - "**/.editorconfig"
      - "**/*.globalconfig"
      - "**/*.ruleset"
      - "src/**"
      - "specs/hifc-mapping/**"
      - "specs/hbr-rules/**"
      - "tools/build_hbr_rulepack.py"
      - "tools/build_hbr_rules_manifest.py"
      - "tools/hifc/**"
      - "tests/**"
      - "tests/fixtures/hifc/**"
      - "README.md"
      - "docs/**"
      - "docs/hifc/acceptance/**"
      - ".github/workflows/build-stage01-gha.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize checkout line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git checkout-index --force .gitattributes

      - name: Check committed diff whitespace
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
            if ([string]::IsNullOrWhiteSpace($env:PR_BASE_SHA)) {
              throw "Pull request base SHA is unavailable."
            }
            $range = "$env:PR_BASE_SHA...$env:HEAD_SHA"
          } elseif ($env:EVENT_NAME -eq "push") {
            if (-not [string]::IsNullOrWhiteSpace($env:BEFORE_SHA) -and
              $env:BEFORE_SHA -notmatch '^0+$') {
              $range = "$env:BEFORE_SHA..$env:HEAD_SHA"
            } else {
              if ([string]::IsNullOrWhiteSpace($env:DEFAULT_BRANCH)) {
                throw "Repository default branch is unavailable."
              }
              $defaultRef = "refs/remotes/origin/$env:DEFAULT_BRANCH"
              git rev-parse --verify $defaultRef
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to resolve default branch ref: $defaultRef"
              }
              $mergeBase = git merge-base $defaultRef $env:HEAD_SHA
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mergeBase)) {
                throw "Unable to resolve merge base for new branch push."
              }
              $range = "$mergeBase..$env:HEAD_SHA"
            }
          } elseif ($env:EVENT_NAME -eq "workflow_dispatch") {
            if ([string]::IsNullOrWhiteSpace($env:DEFAULT_BRANCH)) {
              throw "Repository default branch is unavailable."
            }
            $defaultRef = "refs/remotes/origin/$env:DEFAULT_BRANCH"
            git rev-parse --verify $defaultRef
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to resolve default branch ref: $defaultRef"
            }
            $mergeBase = git merge-base $defaultRef $env:HEAD_SHA
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mergeBase)) {
              throw "Unable to resolve merge base for workflow dispatch."
            }
            $range = "$mergeBase..$env:HEAD_SHA"
          } else {
            throw "Unsupported GitHub event: $env:EVENT_NAME"
          }
          git diff --check $range
          if ($LASTEXITCODE -ne 0) {
            throw "Committed diff whitespace check failed for $range."
          }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET projects
        shell: pwsh
        run: |
          dotnet restore tests/BIMBaoGui.Stage01.Core.Tests/BIMBaoGui.Stage01.Core.Tests.csproj
          dotnet restore src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5 jsonschema==4.23.0

      - name: Run rule pack compiler and packaging contracts
        shell: pwsh
        run: python -m pytest tests/test_hbr_rulepack_compiler.py tests/test_hbr_runtime_packaging_contract.py -q

      - name: Rebuild and verify HBR mapping baseline
        shell: pwsh
        run: |
          $source = "specs/hbr-rules/v1/source/hbr_rule_source.v1.json"
          $baseline = "specs/hbr-rules/v1/compatibility/hbr_rule_compatibility_baseline.v1.json"
          $committedIfc = "tests/fixtures/hifc/HBR_HIFC_全映射结构验证_v1.0.ifc"
          $committedFixtureManifest = "tests/fixtures/hifc/HBR_HIFC_全映射结构验证_v1.0.manifest.json"
          $committedRulesManifest = "specs/hbr-rules/v1/manifest.sha256.json"
          $gateRoot = Join-Path $env:RUNNER_TEMP ("hbr-mapping-baseline-" + [Guid]::NewGuid().ToString("N"))
          $firstRoot = Join-Path $gateRoot "first"
          $secondRoot = Join-Path $gateRoot "second"
          New-Item -ItemType Directory -Force -Path $firstRoot, $secondRoot | Out-Null
          $fixtureName = "HBR_HIFC_全映射结构验证_v1.0.ifc"
          $fixtureManifestName = "HBR_HIFC_全映射结构验证_v1.0.manifest.json"
          $validationName = "HBR_HIFC_全映射结构验证_v1.0.validation.json"
          $firstIfc = Join-Path $firstRoot $fixtureName
          $secondIfc = Join-Path $secondRoot $fixtureName
          $firstFixtureManifest = Join-Path $firstRoot $fixtureManifestName
          $secondFixtureManifest = Join-Path $secondRoot $fixtureManifestName
          $firstValidation = Join-Path $firstRoot $validationName
          $secondValidation = Join-Path $secondRoot $validationName
          $committedValidation = Join-Path $gateRoot "committed.validation.json"
          $rebuiltRulesManifest = Join-Path $gateRoot "manifest.sha256.json"

          python tools/hifc/generate_hifc_mapping_smoke.py `
            --source $source `
            --baseline $baseline `
            --output $firstIfc `
            --manifest $firstFixtureManifest
          if ($LASTEXITCODE -ne 0) { throw "First H-IFC fixture rebuild failed." }
          python tools/hifc/generate_hifc_mapping_smoke.py `
            --source $source `
            --baseline $baseline `
            --output $secondIfc `
            --manifest $secondFixtureManifest
          if ($LASTEXITCODE -ne 0) { throw "Second H-IFC fixture rebuild failed." }

          python tools/hifc/validate_hifc_mapping_smoke.py `
            --source $source `
            --baseline $baseline `
            --ifc $firstIfc `
            --manifest $firstFixtureManifest `
            --report $firstValidation
          if ($LASTEXITCODE -ne 0) { throw "First rebuilt H-IFC fixture validation failed." }
          python tools/hifc/validate_hifc_mapping_smoke.py `
            --source $source `
            --baseline $baseline `
            --ifc $secondIfc `
            --manifest $secondFixtureManifest `
            --report $secondValidation
          if ($LASTEXITCODE -ne 0) { throw "Second rebuilt H-IFC fixture validation failed." }
          python tools/hifc/validate_hifc_mapping_smoke.py `
            --source $source `
            --baseline $baseline `
            --ifc $committedIfc `
            --manifest $committedFixtureManifest `
            --report $committedValidation
          if ($LASTEXITCODE -ne 0) { throw "Committed IFCFlux-accepted fixture validation failed." }

          python tools/build_hbr_rules_manifest.py `
            --root . `
            --output $rebuiltRulesManifest
          if ($LASTEXITCODE -ne 0) { throw "HBR rules manifest rebuild failed." }

          $firstIfcHash = (Get-FileHash $firstIfc -Algorithm SHA256).Hash
          $secondIfcHash = (Get-FileHash $secondIfc -Algorithm SHA256).Hash
          if ($firstIfcHash -ne $secondIfcHash) { throw "H-IFC generator output is not deterministic." }
          $firstFixtureManifestHash = (Get-FileHash $firstFixtureManifest -Algorithm SHA256).Hash
          $secondFixtureManifestHash = (Get-FileHash $secondFixtureManifest -Algorithm SHA256).Hash
          if ($firstFixtureManifestHash -ne $secondFixtureManifestHash) { throw "H-IFC fixture manifest is not deterministic." }
          $firstValidationHash = (Get-FileHash $firstValidation -Algorithm SHA256).Hash
          $secondValidationHash = (Get-FileHash $secondValidation -Algorithm SHA256).Hash
          if ($firstValidationHash -ne $secondValidationHash) { throw "H-IFC validator report is not deterministic." }

          $generatedResult = Get-Content -Raw $firstValidation | ConvertFrom-Json -ErrorAction Stop
          $committedResult = Get-Content -Raw $committedValidation | ConvertFrom-Json -ErrorAction Stop
          if ($generatedResult.status -ne "PASS" -or $committedResult.status -ne "PASS") {
            throw "Generated and committed H-IFC fixtures must both pass the semantic validator."
          }
          $generatedSummary = $generatedResult.summary | ConvertTo-Json -Depth 10 -Compress
          $committedSummary = $committedResult.summary | ConvertTo-Json -Depth 10 -Compress
          if ($generatedSummary -cne $committedSummary) {
            throw "Generated and IFCFlux-accepted fixtures are not semantically equivalent."
          }

          $rebuiltRulesManifestHash = (Get-FileHash $rebuiltRulesManifest -Algorithm SHA256).Hash
          $committedRulesManifestHash = (Get-FileHash $committedRulesManifest -Algorithm SHA256).Hash
          $rebuiltRulesManifestBytes = (Get-Item $rebuiltRulesManifest).Length
          $committedRulesManifestBytes = (Get-Item $committedRulesManifest).Length
          if ($rebuiltRulesManifestHash -ne $committedRulesManifestHash -or
            $rebuiltRulesManifestBytes -ne $committedRulesManifestBytes) {
            throw "Rebuilt HBR rules manifest does not fully match the committed manifest."
          }

      - name: Run repository contract tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Fail on vulnerable NuGet packages
        shell: pwsh
        run: |
          $expectedProjectPath = [IO.Path]::GetFullPath("src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj")
          $inventoryJson = dotnet list src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj package --include-transitive --format json
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet package inventory command failed."
          }
          try {
            $inventory = ($inventoryJson -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "NuGet package inventory returned invalid JSON: $($_.Exception.Message)"
          }
          if ($inventory.version -ne 1) {
            throw "NuGet package inventory returned an unsupported schema version."
          }
          $inventoryProjects = @($inventory.projects | Where-Object { $null -ne $_ })
          if ($inventoryProjects.Count -ne 1) {
            throw "NuGet package inventory must contain exactly one project."
          }
          foreach ($project in $inventoryProjects) {
            if ([string]::IsNullOrWhiteSpace($project.path)) {
              throw "NuGet package inventory project path is missing."
            }
            $projectPath = [IO.Path]::GetFullPath($project.path)
            if (-not [string]::Equals($projectPath, $expectedProjectPath, [StringComparison]::OrdinalIgnoreCase)) {
              throw "NuGet package inventory returned an unexpected project: $projectPath"
            }
            $frameworks = @($project.frameworks | Where-Object { $null -ne $_ })
            if ($frameworks.Count -eq 0) {
              throw "NuGet package inventory project does not contain a framework: $projectPath"
            }
            foreach ($framework in $frameworks) {
              if ([string]::IsNullOrWhiteSpace($framework.framework)) {
                throw "NuGet package inventory contains a framework without an identity."
              }
            }
          }

          $reportJson = dotnet list src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability scan command failed."
          }
          try {
            $report = ($reportJson -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "NuGet vulnerability scan returned invalid JSON: $($_.Exception.Message)"
          }
          if ($report.version -ne 1) {
            throw "NuGet vulnerability scan returned an unsupported schema version."
          }
          $projects = @($report.projects | Where-Object { $null -ne $_ })
          if ($projects.Count -eq 0) {
            throw "NuGet vulnerability scan JSON does not contain a project."
          }
          if ($projects.Count -ne 1) {
            throw "NuGet vulnerability scan must contain exactly one project."
          }
          $vulnerablePackages = @()
          foreach ($project in $projects) {
            if ([string]::IsNullOrWhiteSpace($project.path)) {
              throw "NuGet vulnerability scan project path is missing."
            }
            $projectPath = [IO.Path]::GetFullPath($project.path)
            if (-not [string]::Equals($projectPath, $expectedProjectPath, [StringComparison]::OrdinalIgnoreCase)) {
              throw "NuGet vulnerability scan returned an unexpected project: $projectPath"
            }
            foreach ($framework in @($project.frameworks | Where-Object { $null -ne $_ })) {
              if ([string]::IsNullOrWhiteSpace($framework.framework)) {
                throw "NuGet vulnerability scan contains a framework without an identity."
              }
              $packages = @($framework.topLevelPackages) + @($framework.transitivePackages)
              $packages = @($packages | Where-Object { $null -ne $_ })
              foreach ($package in $packages) {
                if (@($package.vulnerabilities).Count -gt 0) {
                  $vulnerablePackages += [PSCustomObject]@{
                    Project = $project.path
                    Framework = $framework.framework
                    Package = $package.id
                    Version = $package.resolvedVersion
                    Vulnerabilities = (@($package.vulnerabilities) | ConvertTo-Json -Compress)
                  }
                }
              }
            }
          }
          if ($vulnerablePackages.Count -gt 0) {
            $vulnerablePackages | Format-Table -AutoSize | Out-String | Write-Error
            throw "Known vulnerable NuGet packages were found."
          }

      - name: Run core unit tests
        shell: pwsh
        run: dotnet test tests/BIMBaoGui.Stage01.Core.Tests/BIMBaoGui.Stage01.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Build Grasshopper plugin
        shell: pwsh
        run: dotnet build src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:TreatWarningsAsErrors=true

      - name: Verify compiled GHA
        id: verify
        shell: pwsh
        run: |
          $gha = Resolve-Path "src/BIMBaoGui.Stage01/bin/Release/net48/BIMBaoGui.Stage01.gha"
          $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($gha)
          if ($assembly.Name -ne "BIMBaoGui.Stage01") { throw "Unexpected assembly name: $($assembly.Name)" }
          if ($assembly.Version -ne "0.9.0.0") { throw "Unexpected assembly version: $($assembly.Version)" }
          $hash = (Get-FileHash $gha -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $gha).Length
          if ($size -lt 50000) { throw "GHA is unexpectedly small: $size bytes" }
          "gha_path=$gha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Assembly: $($assembly.FullName)"
          Write-Host "SHA256: $hash"
          Write-Host "Size: $size bytes"

      - name: Prepare validation artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src/BIMBaoGui.Stage01/bin/Release/net48/BIMBaoGui.Stage01.gha" "artifacts/BIMBaoGui.Stage01.gha"
          $rulesManifestRelativePath = "specs/hbr-rules/v1/manifest.sha256.json"
          $rulesManifestPath = Resolve-Path $rulesManifestRelativePath
          $rules = Get-Content -Raw $rulesManifestPath | ConvertFrom-Json -ErrorAction Stop
          $manifest = [ordered]@{
            artifactName = "BIMBaoGui.Stage01.gha"
            assemblyVersion = "0.9.0.0"
            sha256 = "${{ steps.verify.outputs.sha256 }}"
            sizeBytes = [int64]"${{ steps.verify.outputs.size }}"
            commitSha = "${{ github.sha }}"
            rulePackageId = $rules.packageId
            rulePackageVersion = $rules.packageVersion
            ruleSourcePath = $rules.ruleSource.path
            ruleSourceSha256 = $rules.ruleSource.sha256
            ruleSourceCanonicalSha256 = $rules.ruleSource.canonicalSha256
            compatibilityBaselinePath = $rules.compatibilityBaseline.path
            compatibilityBaselineSha256 = $rules.compatibilityBaseline.sha256
            rulePackSha256 = $rules.rulePack.sha256
            rulePackPayloadSha256 = $rules.rulePack.payloadSha256
            fixturePath = $rules.fixture.path
            fixtureSha256 = $rules.fixture.sha256
            fixtureManifestPath = $rules.fixture.manifestPath
            fixtureManifestSha256 = $rules.fixture.manifestSha256
            rulesManifestPath = $rulesManifestRelativePath
            rulesManifestId = $rules.manifestId
            rulesManifestSha256 = (Get-FileHash $rulesManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content "artifacts/artifact-manifest.json" -Encoding utf8

      - name: Upload GHA and manifest
        uses: actions/upload-artifact@v4
        with:
          name: BIMBaoGui-Revit2020-Rhino8-v0.9.0-validation
          path: |
            artifacts/BIMBaoGui.Stage01.gha
            artifacts/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
