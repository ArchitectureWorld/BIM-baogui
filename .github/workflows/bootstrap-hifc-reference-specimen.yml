name: Bootstrap H-IFC mapping fixture

on:
  push:
    branches:
      - fix/official-hifc-hardening-v090
    paths:
      - .github/workflows/bootstrap-hifc-reference-specimen.yml
      - .bootstrap/HBR_HIFC_mapping_fixture_bundle.zip

permissions:
  contents: write

concurrency:
  group: bootstrap-hifc-mapping-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack-verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify and extract deterministic fixture bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import zipfile

          archive = Path('.bootstrap/HBR_HIFC_mapping_fixture_bundle.zip')
          expected_sha = '1d689e731527cd1a0c71f5cc046c12767c42a6cbdba9e5870d58c8f4f91b8e96'
          actual_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'fixture bundle SHA mismatch: {actual_sha}')

          allowed = {
              '.gitattributes',
              'docs/hifc/HBR_HIFC_唯一映射基线_v1.0.md',
              'docs/hifc/HBR_HIFC_完整属性映射_359.csv',
              'tests/fixtures/hifc/HBR_HIFC_全映射结构验证_v1.0.ifc',
              'tests/fixtures/hifc/HBR_HIFC_全映射结构验证_v1.0.manifest.json',
              'tests/fixtures/hifc/README.md',
              'tests/test_hifc_mapping_smoke_fixture.py',
              'tools/hifc/generate_hifc_mapping_smoke.py',
              'tools/hifc/validate_hifc_mapping_smoke.py',
          }
          with zipfile.ZipFile(archive) as bundle:
              names = {item.filename for item in bundle.infolist()}
              if names != allowed:
                  raise SystemExit(f'unexpected fixture bundle members: {sorted(names ^ allowed)}')
              for item in bundle.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe fixture bundle member: {item.filename}')
              bundle.extractall('.')
          PY

      - name: Install fixed test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Verify full H-IFC mapping fixture
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m py_compile \
            tools/hifc/generate_hifc_mapping_smoke.py \
            tools/hifc/validate_hifc_mapping_smoke.py \
            tests/test_hifc_mapping_smoke_fixture.py
          python -m pytest -q tests/test_hifc_mapping_smoke_fixture.py

      - name: Commit verified repository files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes docs/hifc tests/fixtures/hifc tests/test_hifc_mapping_smoke_fixture.py tools/hifc
          git diff --cached --check
          git commit -m 'feat: freeze H-IFC mapping authority and full fixture'
          git push origin "HEAD:${GITHUB_REF_NAME}"
