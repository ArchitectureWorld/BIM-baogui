name: Bootstrap H-IFC reference specimen

on:
  push:
    branches:
      - fix/official-hifc-hardening-v090
    paths:
      - .github/workflows/bootstrap-hifc-reference-specimen.yml
      - .bootstrap/HBR_HIFC_reference_specimen_bootstrap.b64.part-*

permissions:
  contents: write

concurrency:
  group: bootstrap-hifc-reference-specimen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack-verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reassemble, verify and extract deterministic source bundle
        shell: bash
        run: |
          cat .bootstrap/HBR_HIFC_reference_specimen_bootstrap.b64.part-* > "$RUNNER_TEMP/hifc-bootstrap.b64"
          base64 --decode "$RUNNER_TEMP/hifc-bootstrap.b64" > "$RUNNER_TEMP/hifc-bootstrap.zip"
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import os
          import zipfile

          archive = Path(os.environ['RUNNER_TEMP']) / 'hifc-bootstrap.zip'
          expected_sha = 'e84f30ce30ddecf0833bc7582877b5991bd6016d8dd22140c05a7337cf8a11dc'
          actual_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'bootstrap archive SHA mismatch: {actual_sha}')

          allowed = {
              'tools/generate_hifc_reference_specimen.py',
              'tests/test_hifc_reference_specimen.py',
              'specimens/hifc/v1/HBR_HIFC_reference_specimen.v1.ifc',
              'specimens/hifc/v1/HBR_HIFC_reference_specimen.v1.contract.json.gz',
              'specimens/hifc/v1/README.md',
              'docs/hifc/HBR_HIFC_mapping_authority_v1.md',
              'specs/hbr-rules/v1/reference/HBR_HIFC_mapping_authority.v1.json',
              'docs/superpowers/plans/2026-08-07-hifc-reference-specimen.md',
          }
          with zipfile.ZipFile(archive) as bundle:
              names = {item.filename for item in bundle.infolist()}
              if names != allowed:
                  raise SystemExit(f'unexpected bootstrap members: {sorted(names ^ allowed)}')
              for item in bundle.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {item.filename}')
              bundle.extractall('.')
          PY

      - name: Install fixed test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Verify H-IFC mapping specimen
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m py_compile tools/generate_hifc_reference_specimen.py tests/test_hifc_reference_specimen.py
          python -m pytest -q tests/test_hifc_reference_specimen.py

      - name: Replace bootstrap with verified repository files
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-hifc-reference-specimen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add deterministic H-IFC mapping reference specimen'
          git push origin "HEAD:${GITHUB_REF_NAME}"
