name: Bootstrap repository baseline

# Temporary self-removing workflow used once to expand the reviewed baseline archive.
on:
  push:
    branches:
      - main
    paths:
      - bootstrap/bim-baogui-baseline.zip
      - .github/workflows/bootstrap-baseline.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          unzip -o bootstrap/bim-baogui-baseline.zip -d .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-baseline.yml

      - name: Commit baseline files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Baseline already present."
            exit 0
          fi
          git commit -m "chore: establish Revit 2020 Grasshopper development baseline"
          git push origin HEAD:main
