name: Materialize HIFC mapping baseline

on:
  push:
    branches:
      - feat/hifc-mapping-gh-baseline-v1
    paths:
      - "specs/hifc-mapping/v1/archive/**"
      - ".github/workflows/materialize-hifc-mapping-baseline.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/hifc-mapping-gh-baseline-v1
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="specs/hifc-mapping/v1/archive"
          tmp_dir="$(mktemp -d)"

          cat "${archive_dir}"/chunk-*.b64 | base64 --decode > "${tmp_dir}/baseline.tar.gz"
          echo "341db436faa8410fb19695a727810dba262e3ab73c11b0c54566d502f3c759b9  ${tmp_dir}/baseline.tar.gz" | sha256sum --check

          tar -xzf "${tmp_dir}/baseline.tar.gz" -C "${tmp_dir}"
          source_dir="${tmp_dir}/GH_HIFC_开发基线_v1"
          test -d "${source_dir}"

          rm -rf \
            specs/hifc-mapping/v1/docs \
            specs/hifc-mapping/v1/data \
            specs/hifc-mapping/v1/generated \
            specs/hifc-mapping/v1/schemas

          cp -R "${source_dir}/docs" specs/hifc-mapping/v1/
          cp -R "${source_dir}/data" specs/hifc-mapping/v1/
          cp -R "${source_dir}/generated" specs/hifc-mapping/v1/
          cp -R "${source_dir}/schemas" specs/hifc-mapping/v1/
          rm -rf "${archive_dir}"

      - name: Write index and manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > specs/hifc-mapping/v1/README.md <<'EOF'
          # GH H-IFC 映射开发基线 v1

          本目录保存从官方 HIFCTool 静态解析结果整理出的 GH / Rhino.Inside.Revit 开发基线。HIFCTool 只作为规则和行为证据来源，项目运行时不依赖该插件。

          ## 内容

          - `docs/`：稳定架构、官方数据边界和实施验收门槛；
          - `data/`：166 条武汉规划报建规则、对象映射和命令契约；
          - `generated/`：确定性共享参数、IFC UserDefinedPsets 和参数绑定清单；
          - `schemas/`：规则包 JSON Schema。

          ## 重要边界

          - `exampleValue` 仅为官方示例值，不是默认值；
          - required / conditional / advisory 尚未由官方规划规则文件编码；
          - 当前基线作为独立开发支线存在，未经明确授权不得合并到主线。
          EOF

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path("specs/hifc-mapping/v1")
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "manifest.sha256.json":
                  continue
              content = path.read_bytes()
              files.append({
                  "path": str(path.relative_to(root)).replace("\\", "/"),
                  "size": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
              })

          manifest = {
              "schemaVersion": "1.0.0",
              "sourceArchiveSha256": "341db436faa8410fb19695a727810dba262e3ab73c11b0c54566d502f3c759b9",
              "fileCount": len(files),
              "files": files,
          }
          (root / "manifest.sha256.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"materialized {len(files)} files")
          PY

      - name: Commit materialized baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/materialize-hifc-mapping-baseline.yml specs/hifc-mapping/v1

          if git diff --cached --quiet; then
            echo "No materialization changes."
            exit 0
          fi

          git commit -m "docs: materialize HIFC mapping baseline v1 [skip ci]"
          git push origin HEAD:feat/hifc-mapping-gh-baseline-v1
