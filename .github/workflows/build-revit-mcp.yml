name: Build BIMBaoGui Revit MCP

on:
  push:
    branches:
      - feat/revit-native-addin-mcp-v0.3
    paths:
      - "src/BIMBaoGui.RevitAddin/McpBridge/**"
      - "src/BIMBaoGui.McpContracts/**"
      - "src/BIMBaoGui.McpServer/**"
      - "tests/test_revit_addin_mcp_contract.py"
      - ".github/workflows/build-revit-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pytest
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Verify MCP sidecar contract
        shell: pwsh
        run: python -m pytest tests/test_revit_addin_mcp_contract.py -q
