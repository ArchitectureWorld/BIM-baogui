name: H-IFC V1 checks

on:
  push:
    branches: [main]
    paths:
      - 'V1/**'
      - 'README.md'
      - '.gitattributes'
      - '.github/workflows/hifc-v1.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: V1/platform-sync/package-lock.json
      - name: Check committed whitespace
        shell: pwsh
        run: |
          git diff-tree --check -r HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed' }
      - name: Build and run reference-core tests
        shell: pwsh
        run: |
          dotnet build V1/tests/Hifc.Reference.Tests/Hifc.Reference.Tests.csproj -c Release --nologo -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed' }
          & V1/tests/Hifc.Reference.Tests/bin/Release/net48/Hifc.Reference.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Build standalone WPF tests
        shell: pwsh
        run: |
          dotnet build V1/tests/Hifc.Ui.Tests/Hifc.Ui.Tests.csproj -c Release --nologo -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'WPF build failed' }
      - name: Run WPF input and rendering regressions
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'hifc-v1-wpf'
          New-Item -ItemType Directory -Force $output | Out-Null
          $test = Start-Process -FilePath (Resolve-Path 'V1/tests/Hifc.Ui.Tests/bin/Release/net48/Hifc.Ui.Tests.exe') -ArgumentList ('"' + $output + '"') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput (Join-Path $output 'stdout.log') -RedirectStandardError (Join-Path $output 'stderr.log')
          Get-Content (Join-Path $output 'stdout.log')
          if ($test.ExitCode -ne 0) { throw 'WPF regressions failed' }
      - name: Install IFC validation dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r V1/requirements-validation.txt
          if ($LASTEXITCODE -ne 0) { throw 'IFC dependency installation failed' }
      - name: Run independent platform-sync and local browser regressions
        shell: pwsh
        working-directory: V1/platform-sync
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Sync dependency installation failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Platform-sync regressions failed' }
      - name: Run IFC tool regressions
        shell: pwsh
        run: |
          python -m unittest discover -s V1/tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'IFC regressions failed' }
      - name: Upload WPF reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIFC-V1-WPF-regressions
          path: ${{ runner.temp }}/hifc-v1-wpf/
          if-no-files-found: warn
