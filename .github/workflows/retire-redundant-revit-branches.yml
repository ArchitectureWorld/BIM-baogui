name: Retire redundant Revit branches

on:
  push:
    branches:
      - feat/revit-native-addin-mcp-v0.3
    paths:
      - ".github/workflows/retire-redundant-revit-branches.yml"

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out canonical Revit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete superseded Revit branches
        shell: bash
        run: |
          set -euo pipefail
          obsolete_branches=(
            "feat/revit-native-addin-v1"
            "feat/revit-native-plugin-v1"
          )

          for branch in "${obsolete_branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Branch still exists after deletion: ${branch}" >&2
              exit 1
            fi
          done

          echo "Only the canonical Revit product branch remains."
