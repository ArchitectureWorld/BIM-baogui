name: Build BIMBaoGui Revit Add-in

on:
  push:
    branches:
      - feat/revit-native-addin-v1
    paths:
      - "src/BIMBaoGui.RevitAddin/**"
      - "tests/BIMBaoGui.RevitAddin.Tests/**"
      - "installer/**"
      - "docs/revit-addin/README.md"
      - "specs/hbr-rules/**"
      - "tools/build_hbr_rulepack.py"
      - "tests/test_revit_addin_*.py"
      - ".github/workflows/build-revit-addin.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/BIMBaoGui.RevitAddin/**"
      - "tests/BIMBaoGui.RevitAddin.Tests/**"
      - "installer/**"
      - "docs/revit-addin/README.md"
      - "specs/hbr-rules/**"
      - "tools/build_hbr_rulepack.py"
      - "tests/test_revit_addin_*.py"
      - ".github/workflows/build-revit-addin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python contract dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 jsonschema==4.23.0

      - name: Verify native add-in scaffold contract
        shell: pwsh
        run: python -m pytest tests/test_revit_addin_scaffold_contract.py -q

      - name: Verify native installer contract
        shell: pwsh
        run: python -m pytest tests/test_revit_addin_installer_contract.py -q

      - name: Verify native Stage01 storage contract
        shell: pwsh
        run: python -m pytest tests/test_revit_addin_stage01_storage_contract.py -q

      - name: Verify native Stage01 Revit contract
        shell: pwsh
        run: python -m pytest tests/test_revit_addin_stage01_revit_contract.py -q

      - name: Verify native Stage01 UI contract
        shell: pwsh
        run: python -m pytest tests/test_revit_addin_stage01_ui_contract.py -q

      - name: Verify native Stage02 Revit contract
        shell: pwsh
        run: python -m pytest tests/test_revit_addin_stage02_revit_contract.py -q

      - name: Restore shared rule-pack build dependency
        shell: pwsh
        run: dotnet restore src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj

      - name: Verify shared HBR rule database
        shell: pwsh
        run: python -m pytest tests/test_hbr_rulepack_compiler.py tests/test_hbr_rules_manifest.py -q

      - name: Restore native projects
        shell: pwsh
        run: |
          dotnet restore src/BIMBaoGui.RevitAddin/BIMBaoGui.RevitAddin.csproj
          dotnet restore tests/BIMBaoGui.RevitAddin.Tests/BIMBaoGui.RevitAddin.Tests.csproj

      - name: Run native domain tests
        shell: pwsh
        run: dotnet test tests/BIMBaoGui.RevitAddin.Tests/BIMBaoGui.RevitAddin.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Build native add-in
        shell: pwsh
        run: dotnet build src/BIMBaoGui.RevitAddin/BIMBaoGui.RevitAddin.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:TreatWarningsAsErrors=true

      - name: Smoke-test native installer
        shell: pwsh
        run: |
          $originalAppData = $env:APPDATA
          $smokeRoot = Join-Path $env:RUNNER_TEMP "BIMBaoGuiInstallerSmoke"
          try {
            $env:APPDATA = Join-Path $smokeRoot "AppData"
            & installer/Install-Revit2020.ps1 `
              -SourceRoot "src/BIMBaoGui.RevitAddin/bin/Release/net48" `
              -Force
            $addinRoot = Join-Path $env:APPDATA "Autodesk\Revit\Addins\2020"
            $manifestPath = Join-Path $addinRoot "BIMBaoGui.RevitAddin.addin"
            $productRoot = Join-Path $addinRoot "BIMBaoGui.RevitAddin"
            $evidencePath = Join-Path $productRoot "install-evidence.json"
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw "Installer smoke test did not create the manifest."
            }
            if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              throw "Installer smoke test did not create install-evidence.json."
            }
            [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
            $assemblyPath = [string]$manifest.RevitAddIns.AddIn.Assembly
            if (-not [IO.Path]::IsPathRooted($assemblyPath)) {
              throw "Installed manifest Assembly path is not absolute."
            }
            $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
            $actualHash = (Get-FileHash -LiteralPath $assemblyPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $evidence.installedDllSha256) {
              throw "Installed DLL hash does not match install evidence."
            }
            & installer/Install-Revit2020.ps1 -Uninstall -Force
            if (Test-Path -LiteralPath $manifestPath) {
              throw "Installer smoke uninstall left the manifest behind."
            }
            if (Test-Path -LiteralPath $productRoot) {
              throw "Installer smoke uninstall left the product directory behind."
            }
          }
          finally {
            $env:APPDATA = $originalAppData
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare installable artifact
        shell: pwsh
        run: |
          $artifactRoot = "artifacts"
          $binaryRoot = Join-Path $artifactRoot "BIMBaoGui.RevitAddin"
          New-Item -ItemType Directory -Force -Path $binaryRoot | Out-Null
          Copy-Item src/BIMBaoGui.RevitAddin/bin/Release/net48/BIMBaoGui.RevitAddin.dll $binaryRoot/
          Copy-Item src/BIMBaoGui.RevitAddin/bin/Release/net48/BIMBaoGui.RevitAddin.pdb $binaryRoot/ -ErrorAction SilentlyContinue
          Copy-Item installer/BIMBaoGui.RevitAddin.addin $artifactRoot/
          Copy-Item installer/Install-Revit2020.ps1 $artifactRoot/
          Copy-Item installer/Install.cmd $artifactRoot/
          Copy-Item installer/Uninstall.cmd $artifactRoot/
          Copy-Item docs/revit-addin/README.md $artifactRoot/README.md
          $hashLines = Get-ChildItem -LiteralPath $artifactRoot -Recurse -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath(
                (Resolve-Path $artifactRoot).Path,
                $_.FullName).Replace(
                  [IO.Path]::DirectorySeparatorChar,
                  [IO.Path]::AltDirectorySeparatorChar)
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            }
          Set-Content -LiteralPath (Join-Path $artifactRoot "SHA256SUMS.txt") `
            -Value $hashLines `
            -Encoding utf8NoBOM

      - name: Verify installable artifact layout
        shell: pwsh
        run: |
          $required = @(
            "artifacts/Install.cmd",
            "artifacts/Uninstall.cmd",
            "artifacts/Install-Revit2020.ps1",
            "artifacts/BIMBaoGui.RevitAddin.addin",
            "artifacts/BIMBaoGui.RevitAddin/BIMBaoGui.RevitAddin.dll",
            "artifacts/README.md",
            "artifacts/SHA256SUMS.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Installable artifact is missing: $path"
            }
          }
          $checksumText = Get-Content -LiteralPath `
            "artifacts/SHA256SUMS.txt" `
            -Raw
          if ($checksumText.Contains([IO.Path]::DirectorySeparatorChar)) {
            throw "Checksum manifest contains a backslash path."
          }

      - name: Upload native add-in
        uses: actions/upload-artifact@v7
        with:
          name: BIMBaoGui-Revit2020-Native-Stage01-Stage02-v0.2.0
          path: artifacts
          if-no-files-found: error
          retention-days: 30
