name: Build BIMBaoGui Revit Add-in

on:
  push:
    branches:
      - feat/revit-native-addin-v1
    paths:
      - "src/BIMBaoGui.RevitAddin/**"
      - "installer/BIMBaoGui.RevitAddin.addin"
      - "specs/hbr-rules/**"
      - "tools/build_hbr_rulepack.py"
      - "tests/test_revit_addin_scaffold_contract.py"
      - ".github/workflows/build-revit-addin.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/BIMBaoGui.RevitAddin/**"
      - "installer/BIMBaoGui.RevitAddin.addin"
      - "specs/hbr-rules/**"
      - "tools/build_hbr_rulepack.py"
      - "tests/test_revit_addin_scaffold_contract.py"
      - ".github/workflows/build-revit-addin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python contract dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 jsonschema==4.23.0

      - name: Verify native add-in scaffold contract
        shell: pwsh
        run: python -m pytest tests/test_revit_addin_scaffold_contract.py -q

      - name: Restore shared rule-pack build dependency
        shell: pwsh
        run: dotnet restore src/BIMBaoGui.Stage01/BIMBaoGui.Stage01.csproj

      - name: Verify shared HBR rule database
        shell: pwsh
        run: python -m pytest tests/test_hbr_rulepack_compiler.py tests/test_hbr_rules_manifest.py -q

      - name: Restore native add-in
        shell: pwsh
        run: dotnet restore src/BIMBaoGui.RevitAddin/BIMBaoGui.RevitAddin.csproj

      - name: Build native add-in
        shell: pwsh
        run: dotnet build src/BIMBaoGui.RevitAddin/BIMBaoGui.RevitAddin.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:TreatWarningsAsErrors=true

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/BIMBaoGui.RevitAddin | Out-Null
          Copy-Item src/BIMBaoGui.RevitAddin/bin/Release/net48/BIMBaoGui.RevitAddin.dll artifacts/BIMBaoGui.RevitAddin/
          Copy-Item src/BIMBaoGui.RevitAddin/bin/Release/net48/BIMBaoGui.RevitAddin.pdb artifacts/BIMBaoGui.RevitAddin/ -ErrorAction SilentlyContinue
          Copy-Item installer/BIMBaoGui.RevitAddin.addin artifacts/

      - name: Upload native add-in
        uses: actions/upload-artifact@v7
        with:
          name: BIMBaoGui-Revit2020-Native-v0.1.0
          path: artifacts
          if-no-files-found: error
          retention-days: 30
