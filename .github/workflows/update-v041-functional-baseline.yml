name: Finalize Stage03 output directory behavior

on:
  push:
    branches:
      - feat/revit-native-addin-mcp-v0.3
    paths:
      - ".github/workflows/update-v041-functional-baseline.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify and decode the deterministic finalizer
        shell: bash
        run: |
          set -euo pipefail
          payload=".github/patches/finalize-stage03-mcp.py.gz.b64"
          test "$(sha256sum "$payload" | awk '{print $1}')" = \
            "1b546f097901566832a10cbb762982e5d45f3fb4b3c25576e275d57f5652ec7b"
          base64 --decode "$payload" \
            | gzip --decompress > "$RUNNER_TEMP/finalize-stage03-mcp.py"
          test "$(sha256sum "$RUNNER_TEMP/finalize-stage03-mcp.py" | awk '{print $1}')" = \
            "3ef3c9855a0a9e08dc9f273a7e476d3515b51b8dc4ce8d115deb38719f0e8bf3"
          python -m py_compile "$RUNNER_TEMP/finalize-stage03-mcp.py"

      - name: Install targeted contract runner
        shell: bash
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Apply the MCP contract change and rebuild the baseline
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/finalize-stage03-mcp.py"
          python -m pytest \
            tests/test_revit_addin_mcp_non_regression.py \
            tests/test_revit_addin_mcp_stage03_contract.py \
            tests/test_revit_addin_stage03_ui_contract.py \
            -q
          git diff --check

      - name: Commit the finalized implementation and baseline
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/BIMBaoGui.RevitAddin/McpBridge/McpStage03Adapter.cs \
            src/BIMBaoGui.RevitAddin/McpBridge/McpBridgeCommandRouter.cs \
            src/BIMBaoGui.McpServer/BimBaoGuiTools.cs \
            tests/test_revit_addin_mcp_stage03_contract.py \
            specs/revit-addin/v0.4.1-functional-baseline.json
          git diff --cached --quiet && {
            echo "Stage03 implementation and baseline were already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: remove Stage03 force reason from MCP"
          git push origin HEAD:feat/revit-native-addin-mcp-v0.3
