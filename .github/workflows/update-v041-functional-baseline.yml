name: Document Stage03 output directory behavior

on:
  push:
    branches:
      - feat/revit-native-addin-mcp-v0.3
    paths:
      - ".github/workflows/update-v041-functional-baseline.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify and decode the README updater
        shell: bash
        run: |
          set -euo pipefail
          payload=".github/patches/update-stage03-readme.py.gz.b64"
          test "$(sha256sum "$payload" | awk '{print $1}')" = \
            "aa97858ec29bbf5453d14ccaebd6e560baed7601c2f5a3a977fd98ed604b4cb4"
          base64 --decode "$payload" \
            | gzip --decompress > "$RUNNER_TEMP/update-stage03-readme.py"
          test "$(sha256sum "$RUNNER_TEMP/update-stage03-readme.py" | awk '{print $1}')" = \
            "7f7ab432b297bd5878ec16bcbca78b037a34d3bb67240b66319f03a991e2cd8c"
          python -m py_compile "$RUNNER_TEMP/update-stage03-readme.py"

      - name: Update and verify the installable README
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/update-stage03-readme.py"
          grep -F "强制测试模式不再要求填写原因" docs/revit-addin/README.md
          grep -F "stage03-output-directories.json" docs/revit-addin/README.md
          grep -F "打开导出位置文件夹" docs/revit-addin/README.md
          git diff --check

      - name: Commit the documentation update
        shell: bash
        run: |
          set -euo pipefail
          git add docs/revit-addin/README.md
          git diff --cached --quiet && {
            echo "Stage03 README was already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: explain Stage03 model-scoped export folders"
          git push origin HEAD:feat/revit-native-addin-mcp-v0.3
