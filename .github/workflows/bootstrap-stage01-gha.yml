name: Bootstrap Stage 01 GHA source

on:
  push:
    branches:
      - feat/stage01-gha-file-initialization
    paths:
      - "bootstrap/stage01-gha/**"
      - ".github/workflows/bootstrap-stage01-gha.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bootstrap/stage01-gha/**"
      - ".github/workflows/bootstrap-stage01-gha.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/stage01-gha-file-initialization

      - name: Reconstruct reviewed source package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/stage01-gha/part-*.b64 > /tmp/stage01-gha.zip.b64
          base64 --decode /tmp/stage01-gha.zip.b64 > /tmp/stage01-gha.zip
          unzip -o /tmp/stage01-gha.zip -d .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-stage01-gha.yml
          rm -f .github/workflows/bootstrap-baseline.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Stage 01 GHA source already present."
            exit 0
          fi
          git commit -m "feat: add Rhino 8 Stage 01 file initialization GHA"
          git push origin HEAD:feat/stage01-gha-file-initialization
